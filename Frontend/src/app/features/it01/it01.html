<p-toast />
<div class="p-6">
  <div class="flex justify-between mb-4">
    <h1 class="text-2xl font-bold">Users</h1>
    <p-button label="ADD" (onClick)="addUser()" />
  </div>

  <p-table
    [value]="data().items"
    [lazy]="true"
    [paginator]="true"
    [rows]="size"
    [totalRecords]="data().total"
    (onLazyLoad)="onPageChange($event)"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>ชื่อ-สกุล</th>
        <th>ที่อยู่</th>
        <th>วันเกิด</th>
        <th>อายุ</th>
        <th>Action</th>
      </tr>
    </ng-template>

    <ng-template #body let-user>
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.fullName }}</td>
        <td>{{ user.address }}</td>
        <td>{{ user.dob }}</td>
        <td>{{ user.age }}</td>
        <td>
          <p-button label="View" size="small" (onClick)="showDetail(user.id)" />
        </td>
      </tr>
    </ng-template>

    <ng-template #empty>
      <tr>
        <td colspan="6" class="text-center py-10 text-gray-400">No data</td>
      </tr>
    </ng-template>
  </p-table>
</div>
